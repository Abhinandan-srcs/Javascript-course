<!DOCTYPE html>
<html>
  <head>
    <title>DOM practise</title>
  </head>
  <body>
    <p>Youtube Subscribe button</p>
    <button onclick="
      subscribe();
    ">subscribe</button>

    <p>Amazom shipping calculater</p>
    <input class="amount" placeholder="Cost of order" onkeydown="handlecost(event);">
    <button onclick="calcTotal();">Calculate</button>
    <p class="ans"></p>

    <script>
      function handlecost(event){
        if(event.key==='Enter'){
          calcTotal();
        }
      }
      
     function subscribe (){
      const element =document.querySelector('button');
      if (element.innerText==='subscribe'){
        element.innerText='subscribed';

      }
      else{
        element.innerText='subscribe';
      }
     }

     function calcTotal(){
      const element = document.querySelector('.amount')
      let cost =(element.value);
      Number(cost);
      

      if (cost < 40){
          cost+=10;
      }
      
      document.querySelector('.ans')
        .innerHTML=`$${cost}`;
   
     }
      
    </script>
  </body>
</html>

<!DOCTYPE html>
<html>
  <head>
    <title>DOM practise</title>

    <style>
      body{
        font-family: Arial, Helvetica, sans-serif;
      }
      .subscribe-button{
       border: none;
       color: white;
       background-color: black;
       padding: 10px 16px 10px 16px;
       font-weight: bold;
       border-radius: 40px;
       cursor: pointer;
       margin-bottom: 30px;
      }
      .is-subscribed{
        background-color: rgb(240, 240, 240);
        color: black;
      }
      .cost-css{
        font-size: 15px;
        padding: 10px;
      }

      .calc-css{
        background-color: green;
        padding: 12px;
        color: white;
        border: none;
        font-size: 15px;
        cursor: pointer;

      }
      .error {
        color: red;
      }

    </style>

  </head>
  <body>
    <p>Youtube Subscribe button</p>
    <button onclick="
      subscribe();
      " class="subscribe-button">subscribe</button>

    <p>Amazom shipping calculater</p>
    <input class="amount cost-css" placeholder="Cost of order" onkeydown="handlecost(event);">
    <button onclick="calcTotal();" class="calc-css">Calculate</button>
    <p class="ans"></p>

    <script>
      function handlecost(event){
        if(event.key==='Enter'){
          calcTotal();
        }
      }
      
     function subscribe (){
      const element =document.querySelector('button');
      if (element.innerText==='subscribe'){
        element.innerText='subscribed';
        element.classList.add('is-subscribed');

      }
      else{
        element.innerText='subscribe';
        element.classList.remove('is-subscribed');
      }
     }

      function calcTotal(){
        const element = document.querySelector('.amount');
        const ans = document.querySelector('.ans'); // 👈 moved here
        let cost = Number(element.value);
        
        if (cost < 0){
          ans.innerHTML = "Error: cost cannot be less than $0";
          ans.classList.add('error');
          return;
        }

        ans.classList.remove('error');

        if (cost < 40){
          cost += 10;
        }
        
        ans.innerHTML = `$${cost}`;
      }
    </script>
  </body>
</html>
